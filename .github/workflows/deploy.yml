# ─────────────────────────────────────────────────────────────────────────────
# SIAN KITCHEN — Automatic GitHub Pages deploy
# Push to main → site builds → live at https://<username>.github.io/<repo>/
#
# One-time setup after first push:
#   Repo → Settings → Pages → Source: "GitHub Actions"
# ─────────────────────────────────────────────────────────────────────────────
name: Deploy to GitHub Pages

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci || npm install

      # --base=./ makes every asset path relative, so the site works
      # on any GitHub Pages subpath without touching vite.config
      - name: Build
        run: npm run build -- --base=./

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
